<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리는 아직 『 』입니다</title>
<meta name="description" content="이야기를 무기 삼아 독자를 뺏는, 마작류 배틀. NAN 게임 제작 해커톤 출품작.">
<style>
  /* ===== 시작 화면 =====
     게임 로직에 전혀 의존하지 않는 독립 페이지.
     모드는 아래 <script> 의 MODES 배열 하나로만 정의된다 —
     모드가 늘거나 주소가 바뀌면 그 배열만 고치면 되고, 마크업은 손대지 않는다. */
  :root{
    --ink:#e8e4d8;          /* 본문 글자 */
    --dim:#8fa79c;          /* 보조 글자 */
    --gold:#f2c94c;         /* 강조(양피지 금박) */
    --line:#3a5a4e;         /* 테두리 */
    --panel:rgba(8,16,13,.55);
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--ink);
    font-family:"Noto Serif KR","Noto Sans KR",system-ui,serif;
    background:radial-gradient(ellipse at 50% 34%, #234339, #142a24 58%, #0b1714);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:40px 20px;gap:38px}

  /* 종이 결 — 이미지 없이 아주 옅은 노이즈만. 배포 경로에 의존하지 않게 CSS로 처리 */
  body::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.5;
    background:
      radial-gradient(circle at 18% 22%, rgba(255,255,255,.030), transparent 45%),
      radial-gradient(circle at 82% 74%, rgba(255,255,255,.022), transparent 42%)}

  /* --- 표제 --- */
  .head{text-align:center;position:relative;z-index:1}
  .kicker{font-size:12px;letter-spacing:.22em;color:var(--dim);margin:0 0 14px}
  h1{margin:0;font-size:clamp(26px,5vw,42px);font-weight:700;letter-spacing:.02em;
    text-shadow:0 2px 14px rgba(0,0,0,.6)}
  h1 .blank{color:var(--gold)}
  .tagline{margin:14px 0 0;font-size:14px;color:var(--dim);line-height:1.7}

  /* --- 모드 카드 --- */
  .modes{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;
    position:relative;z-index:1;max-width:900px;width:100%}
  .mode{flex:1 1 250px;max-width:280px;min-height:250px;
    display:flex;flex-direction:column;text-decoration:none;color:inherit;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px 20px 18px;
    box-shadow:0 6px 22px rgba(0,0,0,.45);
    transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease}
  .mode:hover,.mode:focus-visible{transform:translateY(-6px);border-color:var(--gold);
    box-shadow:0 12px 30px rgba(0,0,0,.55);outline:none}
  .mode:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  .glyph{font-size:30px;line-height:1;margin-bottom:14px;opacity:.9}
  .mode h2{margin:0;font-size:19px;font-weight:700}
  .seats{display:inline-block;margin-top:8px;font-size:11px;color:var(--gold);
    border:1px solid rgba(242,201,76,.45);border-radius:999px;padding:2px 10px}
  .mode p{margin:14px 0 0;font-size:13px;line-height:1.75;color:var(--dim);flex:1}
  .go{margin-top:16px;font-size:13px;font-weight:700;color:var(--gold)}

  /* 처음 오는 사람을 어디로 보낼지 한 곳만 표시 — 선택지가 셋이면 길잡이가 필요하다 */
  .mode.first{border-color:rgba(242,201,76,.5)}
  .flag{position:absolute;transform:translateY(-34px);
    font-size:11px;color:#1a2a24;background:var(--gold);
    border-radius:999px;padding:3px 11px;font-weight:700}
  .mode.first{position:relative}

  .foot{font-size:11px;color:#5f776d;text-align:center;line-height:1.9;
    position:relative;z-index:1}
  .foot a{color:#7f9a8f}
</style>
</head>
<body>
  <header class="head">
    <p class="kicker">NAN 게임 제작 해커톤</p>
    <h1>우리는 아직 <span class="blank">『 』</span>입니다</h1>
    <p class="tagline">이야기를 무기 삼아 독자를 뺏는, 마작류 배틀</p>
  </header>

  <nav class="modes" id="modes" aria-label="모드 선택"></nav>

  <footer class="foot">
    마작을 몰라도 됩니다. 같은 장르로 <b>기 → 승 → 전 → 결</b>을 이으면 이야기가 완성됩니다.
  </footer>

<script>
  // 모드 정의 — 이 배열이 시작 화면의 유일한 설정값.
  // 새 모드가 생기면 여기 한 칸만 추가하면 카드가 따라 생긴다.
  const MODES = [
    { href:'./3p/m2.html', glyph:'🕯', name:'입문 스테이지',
      seats:'1인 · 보스전', first:true,
      desc:'거대한 호러 작가와 마주 앉아 한 권을 완성합니다. 망각이 다 차기 전에. 규칙을 몸으로 익히는 관문.' },
    { href:'./duel.html', glyph:'✒', name:'2인 대국',
      seats:'1:1', first:false,
      desc:'라이벌 이야기꾼과의 정면 승부. 운명 뺏기와 특수 능력까지 갖춘 본편입니다.' },
    { href:'./3p/index.html', glyph:'📖', name:'3인 대국',
      seats:'3인', first:false,
      desc:'셋이 한 판. 누가 먼저 결말을 쓰느냐의 눈치싸움이 붙습니다.' },
  ];

  // 렌더 — 데이터를 카드로 옮기는 것 하나만 한다.
  const nav = document.getElementById('modes');
  for (const m of MODES) {
    const a = document.createElement('a');
    a.className = 'mode' + (m.first ? ' first' : '');
    a.href = m.href;
    a.innerHTML =
      (m.first ? '<span class="flag">처음이라면 여기</span>' : '')
      + `<div class="glyph" aria-hidden="true">${m.glyph}</div>`
      + `<h2>${m.name}</h2><div><span class="seats">${m.seats}</span></div>`
      + `<p>${m.desc}</p><div class="go">시작하기 →</div>`;
    nav.appendChild(a);
  }
</script>
</body>
</html>
